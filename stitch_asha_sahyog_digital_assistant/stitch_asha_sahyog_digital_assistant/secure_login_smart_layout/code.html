<body class="bg-surface-dim min-h-screen font-body-md text-on-surface antialiased flex flex-col justify-center items-center p-margin-mobile relative overflow-x-hidden" data-sukanya-page="login" data-sakhi-page="login">
<!-- Top Navigation is intentionally suppressed for Transactional/Linear page -->
<!-- Background Decorative Elements (matches registration screen) -->
<div class="absolute -top-32 -right-32 w-64 h-64 bg-accent-saffron rounded-full mix-blend-multiply filter blur-3xl opacity-50 z-[-1] animate-pulse"></div>
<div class="absolute -bottom-32 -left-32 w-64 h-64 bg-accent-green rounded-full mix-blend-multiply filter blur-3xl opacity-50 z-[-1] animate-pulse" style="animation-delay: 2s;"></div>
<main class="w-full max-w-md mx-auto relative z-10">
<!-- Banner -->
<div class="mb-stack-lg bg-accent-green border border-secondary-fixed-dim rounded-lg p-4 flex items-center gap-3">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<p class="font-body-sm text-on-secondary-fixed-variant m-0">SMS PIN sent to your registered mobile.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline rounded-xl shadow-sm p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-saffron to-secondary"></div>
<div class="text-center mb-stack-lg">
<div class="w-16 h-16 bg-surface-container-low rounded-full flex items-center justify-center mx-auto mb-4 border border-outline-variant shadow-sm">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary m-0">Secure Login</h1>
<p class="font-body-sm text-on-surface-variant mt-2">Access your Sukanya ASHA Digital account</p>
</div>
<form class="flex flex-col gap-stack-md" id="login-form">
<!-- Mobile Number Input -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-primary" for="mobile">Enter Mobile Number</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant">call</span>
<input aria-label="Mobile Number" class="w-full h-touch-target-min pl-10 pr-4 bg-surface rounded border border-outline focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-on-surface" id="mobile" placeholder="+91 XXXXX XXXXX" type="tel">
</div>
</div>
<!-- PIN Input -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-primary" for="pin">Enter 4-Digit SMS PIN</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant">dialpad</span>
<input aria-label="4-Digit SMS PIN" class="w-full h-touch-target-min pl-10 pr-12 bg-surface rounded border border-outline focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-on-surface tracking-widest text-center" id="pin" maxlength="4" placeholder="••••" type="password">
<!-- Voice Input trailing icon as per style guide -->
<div class="absolute right-0 top-0 h-full flex items-center pr-2 border-l border-outline ml-2 pl-2 cursor-pointer">
<span class="material-symbols-outlined text-primary">mic</span>
</div>
</div>
</div>
<!-- Action Button -->
<button class="mt-stack-sm w-full h-touch-target-min bg-primary text-on-primary font-label-lg text-label-lg rounded-lg shadow-[0_4px_14px_0_rgba(0,33,71,0.39)] hover:shadow-[0_6px_20px_rgba(0,33,71,0.23)] active:scale-95 transition-all flex items-center justify-center gap-2" type="submit">
                    Login
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>

<button type="button" id="demo-login-btn" class="w-full h-touch-target-min bg-secondary text-on-secondary font-label-lg text-label-lg rounded-lg shadow-sm active:scale-95 transition-transform flex items-center justify-center gap-2 hover:opacity-90">
    <span class="material-symbols-outlined">bolt</span>
    1-Click Demo Login (Auto)
</button>
</form>
<div class="mt-stack-lg text-center space-y-2">
<a class="font-body-sm text-primary hover:underline block" href="#" id="resend-pin-link">Resend PIN</a>
<a class="font-body-sm text-secondary hover:underline block" href="../worker_registration_smart_layout/code.html">New ASHA Worker? Register Here</a>
</div>
</div>
</main>
