<body class="bg-surface-dim min-h-screen flex flex-col" data-sukanya-page="register" data-sakhi-page="register">
<!-- Transactional Screen - Top Navigation Shell Suppressed as per Shared Components Logic -->
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Centered Registration Card -->
<div class="bg-surface-container-lowest border border-outline rounded-xl w-full max-w-md p-6 md:p-8 flex flex-col gap-stack-lg shadow-sm">
<!-- Brand & Context -->
<div class="flex flex-col gap-stack-sm text-center items-center">
<div class="w-16 h-16 rounded-full bg-accent-saffron flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-saffron text-3xl" data-icon="clinical_notes">clinical_notes</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Sukanya Worker Registration</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
Enter your registered mobile number to receive your secure login PIN via SMS.
</p>
</div>
<!-- Form -->
<form id="register-form" class="flex flex-col gap-stack-md">
<!-- Input Group -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-primary" for="mobile_number">Enter Mobile Number</label>
<div class="relative flex items-center w-full">
<!-- Prefix -->
<div class="absolute left-4 flex items-center justify-center pointer-events-none text-on-surface-variant font-body-md text-body-md border-r border-outline pr-3">
+91
</div>
<!-- Input -->
<input class="w-full h-touch-target-min pl-16 pr-14 border border-outline rounded-lg bg-surface-container-lowest font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow" id="mobile_number" name="mobile_number" pattern="[0-9]{10}" placeholder="9876543210" value="9876543210" required="" type="tel">
<!-- Voice Input Action -->
<button aria-label="Use voice input" class="absolute right-2 h-10 w-10 flex items-center justify-center text-primary rounded-md hover:bg-surface-container-low transition-colors group" type="button">
<span class="material-symbols-outlined text-2xl group-active:text-secondary group-active:scale-95 transition-transform" data-icon="mic" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">10-digit mobile number</p>
</div>
<!-- Action Button -->
<button id="register-submit-btn" class="w-full h-touch-target-min bg-primary text-on-primary font-label-lg text-label-lg rounded-lg mt-4 hover:bg-primary-container active:bg-primary-container shadow-sm active:shadow-md transition-all duration-200 flex items-center justify-center gap-2" type="submit">
Generate SMS PIN
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="text-center mt-2">
<a class="font-label-md text-label-md text-primary hover:underline" href="../sms_pin_login/code.html">Already have a PIN? Log In</a>
</div>
</div>
</main>
