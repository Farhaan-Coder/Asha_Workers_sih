<script>
        function toggleAccordion(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        // Simple mock for mic interaction
        document.querySelectorAll('button[aria-label="Voice Input"]').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                this.classList.toggle('mic-active');
                this.classList.toggle('bg-error-container');
                this.classList.toggle('text-error');
                
                const icon = this.querySelector('span');
                if (this.classList.contains('mic-active')) {
                    icon.style.fontVariationSettings = "'FILL' 1";
                } else {
                    icon.style.fontVariationSettings = "'FILL' 0";
                }
            });
        });
    </script>
