<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>ASHA Digital - Secure Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

            "colors": {
                    "secondary-fixed-dim": "#88d982",

                    "accent-saffron": "#fff3e0",

                    "inverse-on-surface": "#f1f0f4",
                    "error-container": "#ffdad6",
                    "surface-bright": "#faf9fd",
                    "on-surface-variant": "#44474e",
                    "inverse-primary": "#aec7f6",
                    "secondary-container": "#a0f399",
                    "secondary-fixed": "#a3f69c",
                    "green-vibrant": "#2ecc71",
                    "on-secondary-fixed": "#002204",
                    "on-secondary": "#ffffff",
                    "primary-fixed-dim": "#aec7f6",
                    "primary": "#002147",
                    "surface-container-low": "#f4f3f7",
                    "surface-variant": "#e3e2e6",
                    "surface-dim": "#f3f4f6",
                    "on-error": "#ffffff",
                    "on-primary-fixed-variant": "#2d476f",
                    "inverse-surface": "#2f3033",
                    "outline": "#cbd5e1",
                    "error": "#dc2626",
                    "tertiary": "#180500",

                    "surface-container-high": "#e9e7eb",
                    "primary-fixed": "#d6e3ff",
                    "on-primary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-error-container": "#93000a",
                    "on-tertiary-container": "#b97958",
                    "on-tertiary-fixed": "#341100",
                    "surface-container-highest": "#e3e2e6",
                    "on-primary-container": "#708ab5",
                    "surface": "#faf9fd",
                    "tertiary-fixed-dim": "#ffb691",
                    "on-background": "#1a1b1e",
                    "surface-tint": "#465f88",
                    "background": "#faf9fd",
                    "tertiary-container": "#3d1500",
                    "primary-container": "#002147",
                    "outline-variant": "#c4c6cf",
                    "tertiary-fixed": "#ffdbcb",
                    "on-secondary-fixed-variant": "#005312",
                    "surface-container": "#efedf1"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "1rem",
                    "stack-lg": "1.5rem",
                    "margin-mobile": "1rem",
                    "margin-desktop": "2.5rem",

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased pt-touch-target-min pb-[72px] md:pb-0" data-sukanya-page="login" data-sakhi-page="login">
<!-- TopAppBar -->
<header class="fixed top-0 w-full border-t-4 border-t-saffron border-b border-outline dark:border-outline-variant bg-surface-container-lowest dark:bg-surface-dim z-50 h-touch-target-min transition-colors duration-200">
<div class="flex justify-between items-center px-margin-mobile h-full w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary font-bold">verified_user</span>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary truncate px-2">Sukanya ASHA Digital</h1>
</div>
<button aria-label="Profile" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-primary hover:bg-surface-container transition-colors duration-200">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface-bright">
<div class="w-full max-w-md w-full relative z-10">
<!-- Toast Notification -->
<div class="mb-stack-lg bg-accent-green border border-secondary/20 rounded-lg p-4 flex items-start gap-3 shadow-sm transform transition-all duration-300 translate-y-0 opacity-100" id="toast-banner">
<span class="material-symbols-outlined text-secondary mt-0.5">check_circle</span>
<p class="font-body-sm text-body-sm text-on-secondary-container">Demo Mode: Instant 1-Click Login available below.</p>
<button class="ml-auto text-secondary/70 hover:text-secondary h-6 w-6 flex items-center justify-center" onclick="document.getElementById('toast-banner').style.display='none'">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline rounded-xl p-6 md:p-8 shadow-sm">
<div class="text-center mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-primary mb-2">Secure Login</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Authenticate to access the clinical health assistant.</p>
</div>
<form id="login-form" class="space-y-stack-md">
<!-- Mobile Number Field -->
<div>
<label class="block font-label-md text-label-md text-primary mb-2" for="mobile">Enter Mobile Number</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant z-10">phone_iphone</span>
<input class="w-full h-touch-target-min pl-10 pr-12 bg-surface border border-outline rounded-lg font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="mobile" name="mobile" placeholder="e.g. 9876543210" type="tel" value="9876543210" required>
<button aria-label="Voice Input" class="absolute right-1 w-[40px] h-[40px] flex items-center justify-center text-primary hover:bg-surface-container rounded-md transition-colors z-10 border-l border-outline/50 ml-1" type="button">
<span class="material-symbols-outlined text-primary">mic</span>
</button>
</div>
</div>
<!-- SMS PIN Field -->
<div>
<label class="block font-label-md text-label-md text-primary mb-2" for="pin">Enter 4-Digit SMS PIN</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant z-10">lock</span>
<input autofocus="" class="w-full h-touch-target-min pl-10 pr-[88px] bg-surface border border-outline rounded-lg font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none text-center tracking-[0.5em]" id="pin" name="pin" maxlength="4" placeholder="••••" type="password">
<div class="absolute right-1 flex items-center h-full gap-1">
<button aria-label="Toggle PIN visibility" class="w-[36px] h-[36px] flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors z-10" onclick="const input = document.getElementById('pin'); const icon = document.getElementById('eye-icon'); if(input.type === 'password') { input.type = 'text'; icon.textContent = 'visibility'; } else { input.type = 'password'; icon.textContent = 'visibility_off'; }" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility_off</span>
</button>
</div>
</div>
<div class="flex justify-between items-center mt-2 px-1">
<span class="font-body-sm text-[12px] text-on-surface-variant">Default PIN: <strong class="text-primary font-bold">4238</strong></span>
<button id="resend-pin-link" class="font-label-md text-[12px] text-primary hover:underline" type="button">Request New PIN</button>
</div>
</div>
<!-- Actions -->
<div class="pt-stack-sm flex flex-col gap-2">
<button class="w-full h-touch-target-min bg-primary text-on-primary font-label-lg text-label-lg rounded-lg shadow-sm hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Login with PIN</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<button id="demo-login-btn" type="button" class="w-full h-touch-target-min bg-secondary text-on-secondary font-label-lg text-label-lg rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">flash_on</span>
<span>One-Click Demo Login</span>
</button>
</div>
</form>
</div>
<div class="mt-stack-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
End-to-end encrypted medical connection
</p>
</div>
</div>
</main>
<script src="../shared/sakhi-api.js"></script>
<script src="../shared/sakhi-i18n.js"></script>
<script src="../shared/sakhi-ui.js"></script>
<script src="../shared/sakhi-app.js"></script>
</body></html>
